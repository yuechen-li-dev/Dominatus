name: Dominatus 1.0 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.0.0
      validate_trusted_publishing:
        description: Authenticate with NuGet OIDC without publishing
        required: true
        type: boolean
        default: false
      publish_nuget:
        description: Publish manifest packages to NuGet
        required: true
        type: boolean
        default: false
      create_github_release:
        description: Create a GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate version
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw "Invalid semantic version: $version" }
          if ($version -ne '1.0.0') { throw "This workflow freezes the 1.0 release at 1.0.0; received $version." }
      - run: dotnet restore Dominatus.Release.slnx
      - run: dotnet build Dominatus.Release.slnx -c Release --no-restore
      - name: Test release set with hang diagnostics
        run: |
          $dotnetHost = (Get-Command dotnet -ErrorAction Stop).Source
          "DOTNET_HOST_PATH=$dotnetHost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          dotnet test Dominatus.Release.slnx -c Release --no-build --blame-hang-timeout 2m --blame-hang-dump-type mini
      - name: Pack approved packages
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          foreach ($p in 'Dominatus.Core','Dominatus.OptFlow','Dominatus.UtilityLite','Ariadne.OptFlow','Dominatus.Actuators.Standard','Dominatus.Actuators.HomeAssistant','Dominatus.Actuators.Audio','Dominatus.Actuators.Payments','Dominatus.Actuators.Payments.Stripe','Dominatus.Actuators.Payments.PayPal') {
            dotnet pack "src/$p/$p.csproj" -c Release --no-restore -o artifacts/packages /p:Version=${{ inputs.version }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate package contents and package-only smoke
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead('artifacts/packages/Dominatus.OptFlow.${{ inputs.version }}.nupkg')
          try { $entries = $archive.Entries.FullName; if ($entries -notcontains 'analyzers/dotnet/cs/Dominatus.OptFlow.Generators.dll') { throw 'OptFlow analyzer is missing from its package.' }; if ($entries -match '^lib/.*/Dominatus\.OptFlow\.Generators\.dll$') { throw 'OptFlow generator was incorrectly packaged as a runtime library.' } } finally { $archive.Dispose() }
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'nuget'
          dotnet restore tests/Dominatus.Release.PackageSmoke/Dominatus.Release.PackageSmoke.csproj --source (Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Dominatus.Release.PackageSmoke/Dominatus.Release.PackageSmoke.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: dominatus-${{ inputs.version }}-packages
          path: artifacts/packages/*.*nupkg
      - name: NuGet trusted publishing login
        if: ${{ inputs.validate_trusted_publishing || inputs.publish_nuget }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish approved packages
        if: ${{ inputs.publish_nuget }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NuGet trusted publishing did not provide a temporary API key.' }
          dotnet nuget push 'artifacts/packages/*.nupkg' --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" artifacts/packages/*.*nupkg --title "Dominatus ${{ inputs.version }}" --notes-file docs/release/DOMINATUS_1_0_RELEASE_NOTES.md
